services:
  registry:
    container_name: registry
    deploy:
      resources:
        limits:
          pids: 2048
    environment:
      - HOST_CONTAINERNAME=${SERVICE}
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      - OTEL_TRACES_EXPORTER=none
      - TZ=Europe/Berlin
    # /v2/ is the registry API root, but it answers 401 behind the htpasswd realm, so
    # the probe uses the unauthenticated root path instead. A 200 there means the
    # registry process is serving.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    networks:
      smoonet:
    ports:
      - "5001:5000/tcp"
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/registry/auth:/auth:rw
      - /mnt/user/appdata/registry/config/config.yml:/etc/distribution/config.yml:ro
      - /mnt/user/appdata/registry/data:/var/lib/registry:rw
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${SERVICE}-internal.middlewares=gzip@file
      - traefik.http.routers.${SERVICE}-internal.priority=5000
      - traefik.http.routers.${SERVICE}-internal.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-internal.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${SERVICE}-external.entrypoints=websecure-external
      # This middleware is intentionally chosen to allow authentication to pass through to the registry, which will handle it. Do not change to "chain-external@file" or similar, as that would break authentication.
      - traefik.http.routers.${SERVICE}-external.middlewares=chain-external-bypass@file
      - traefik.http.routers.${SERVICE}-external.priority=10
      - traefik.http.routers.${SERVICE}-external.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-external.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-external.tls=true
      # Service port (must match the port Komodo listens on INSIDE the container)
      - traefik.docker.network=smoonet
      - traefik.http.services.${SERVICE}.loadbalancer.server.url=${TRAEFIK_INTERNAL_URL}
      ## End Traefik Config
      # AutoKuma: this container owns its Uptime Kuma monitor. Every field is written
      # here because the stack runs without AUTOKUMA__DEFAULT_SETTINGS, so an omitted
      # field falls back to AutoKuma's own default, not to the previous monitor's value.
      # docker_host and notification_id_list carry Kuma's numeric ids on purpose: the
      # name-based label variants (docker_host_name, notification_name_list) resolve
      # only through AutoKuma's own store, so they cannot reference the hand-built
      # DockerProxy host or the smooBot notification.
      - kuma.registry.docker.name=registry - registry
      - kuma.registry.docker.docker_container=registry
      - kuma.registry.docker.docker_host=1
      - kuma.registry.docker.interval=300
      - kuma.registry.docker.max_retries=1
      - kuma.registry.docker.retry_interval=300
      - kuma.registry.docker.resend_interval=0
      # no timeout label: AutoKuma 2.0.0's Docker monitor variant has no timeout field,
      # so the label is dropped silently and Kuma stores 0. Harmless for this type -
      # the docker check derives its own deadline from the interval either way.
      - 'kuma.registry.docker.notification_id_list={"1": true}'
      # Second Uptime Kuma monitor on the same container, owned by AutoKuma. Rebuild of the
      # hand-built http monitor id 43, migration wave 3b. The AutoKuma id is registry-http
      # rather than registry, because the docker monitor above already holds that id, and
      # the monitor name carries the same suffix so the two are told apart in Kuma. No
      # basic_auth and no headers: #1809 measured the endpoint answering 200 without
      # credentials, and the columns on the old monitor are leftovers of a Traefik
      # middleware that no longer exists.
      - kuma.registry-http.http.name=registry - registry-http
      - kuma.registry-http.http.url=https://registry.example.com
      - kuma.registry-http.http.method=GET
      - 'kuma.registry-http.http.accepted_statuscodes=["200-299"]'
      - kuma.registry-http.http.max_redirects=10
      - kuma.registry-http.http.http_body_encoding=json
      - kuma.registry-http.http.timeout=4
      - kuma.registry-http.http.interval=300
      - kuma.registry-http.http.max_retries=1
      - kuma.registry-http.http.retry_interval=300
      - kuma.registry-http.http.resend_interval=0
      - kuma.registry-http.http.ignore_tls=false
      - kuma.registry-http.http.expiry_notification=true
      - kuma.registry-http.http.upside_down=false
      - 'kuma.registry-http.http.notification_id_list={"1": true}'
      # Komodo restore
      - com.smoochy.komodo.restore_stack=${SERVICE}
      # Unraid metadata
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/docker-moby.png
      - net.unraid.docker.webui=${UNRAID_WEBGUI_URL}
  registry-ui:
    container_name: registry-ui
    depends_on:
      - registry
    deploy:
      resources:
        limits:
          pids: 2048
    environment:
      - HOST_CONTAINERNAME=${REGISTRY_UI_SERVICE}
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      - TZ=Europe/Berlin
    # The UI is the only surface this image exposes and it has no health endpoint, so
    # the probe falls back to the root path.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: quiq/registry-ui:0.12.0@sha256:0d066cddfb87427d1907801cd5f955a5af4633ac3bae25273184dd80a96289be
    networks:
      smoonet:
    ports:
      - "8002:8000/tcp"
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/registry-ui/config/config.yml:/opt/config.yml:ro
      - /mnt/user/appdata/registry-ui/data:/opt/data:rw
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.middlewares=chain-internal@file
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.priority=5000
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.rule=Host(`${REGISTRY_UI_EXTERNAL_URL}`)
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.service=${REGISTRY_UI_SERVICE}
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.entrypoints=websecure-external
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.middlewares=chain-external@file
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.priority=10
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.rule=Host(`${REGISTRY_UI_EXTERNAL_URL}`)
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.service=${REGISTRY_UI_SERVICE}
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-external.tls=true
      # # HTTP-Header
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.entrypoints=websecure-external
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.middlewares=chain-external-bypass@file
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.priority=2500
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.rule=Host(`${REGISTRY_UI_EXTERNAL_URL}`) && Header(`${SPECIAL_HEADER_NAME}`, `${SPECIAL_HEADER_SECRET}`)
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.service=${REGISTRY_UI_SERVICE}
      - traefik.http.routers.${REGISTRY_UI_SERVICE}-bypass.tls=true
      # Service port (must match the port Komodo listens on INSIDE the container)
      - traefik.docker.network=smoonet
      - traefik.http.services.${REGISTRY_UI_SERVICE}.loadbalancer.server.url=${REGISTRY_UI_INTERNAL_URL}
      ## End Traefik Config
      # Komodo restore
      - com.smoochy.komodo.restore_stack=registry
      # Unraid metadata
      - net.unraid.docker.icon=https://github.com/juusujanar/unraid-templates/raw/master/img/DockerRegistry-logo.png
      - net.unraid.docker.webui=${REGISTRY_UI_UNRAID_WEBGUI_URL}
networks:
  smoonet:
    external: true
