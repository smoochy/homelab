http:
  middlewares:
    # The traefik-warp plugin (github.com/l4rm4nd/traefik-warp) used to sit at the head of every
    # chain and was removed for good. It fetched the Cloudflare and CloudFront IP ranges over
    # HTTPS inside its New(), synchronously, and Traefik calls New() once per router: 126 routers
    # at roughly 2s each meant every Traefik start served 404 on all Docker routers for three
    # minutes. It also earned nothing - the real client IP behind Cloudflare is already recovered
    # twice statically, by forwardedHeaders.trustedIPs on the websecure-external entrypoint and
    # by the bouncer's own forwardedheaderstrustedips - and on a failed fetch it falls back to
    # trusting every IP.

    gzip:
      compress: {}

    # 1) Rate limit to slow down scanners / brute traffic
    homepage-ratelimit:
      rateLimit:
        average: 100 # requests/sec averaged
        burst: 200 # allowed burst

    # Optional hardening headers (safe defaults)
    homepage-secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "no-referrer"

    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
        forceSTSHeader: true
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        permissionsPolicy: >
          camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)
        referrerPolicy: "same-origin"
        sslProxyHeaders:
          X-Forwarded-Proto: https
        # stsIncludeSubdomains: true
        # stsPreload: false              #keep false
        # stsSeconds: 63072000           # 2 years

    # Combining the single middlewares into a chain.
    # crowdsec-bouncer@docker is defined by labels on the traefik service in compose.yaml and
    # only belongs in the external chains: internal traffic never passes CrowdSec's decisions.
    chain-internal:
      chain:
        middlewares:
          - security-headers
          # - TODO: Authentik
          - gzip

    chain-internal-bypass:
      chain:
        middlewares:
          - security-headers
          - gzip

    chain-external:
      chain:
        middlewares:
          - security-headers
          - crowdsec-bouncer@docker
          #- TODO: Authentik
          - gzip

    # Needed for Registry
    chain-external-bypass:
      chain:
        middlewares:
          - security-headers
          - crowdsec-bouncer@docker
          - gzip

  routers:
    adguard-secondary:
      rule: Host(`adguard.example.com`)
      entryPoints:
        - websecure-external
      tls: {}
      service: adguard-secondary
      middlewares:
        - chain-external

    adguard-secondary-internal:
      rule: "Host(`adguard.example.com`)"
      entryPoints:
        - websecure-internal
      tls: {}
      service: adguard-secondary
      middlewares:
        - chain-internal

    homeassistant:
      rule: Host(`ha.example.com`)
      entryPoints:
        - websecure-external
      tls: {}
      service: homeassistant
      middlewares:
        - chain-external

    homeassistant-internal:
      rule: "Host(`ha.example.com`)"
      entryPoints:
        - websecure-internal
      tls: {}
      service: homeassistant
      middlewares:
        - chain-internal

    storage-host:
      rule: Host(`storage-host.example.com`)
      entryPoints:
        - websecure-external
      tls: {}
      service: storage-host
      middlewares:
        - chain-external

    storage-host-internal:
      rule: "Host(`storage-host.example.com`)"
      entryPoints:
        - websecure-internal
      tls: {}
      service: storage-host
      middlewares:
        - gzip

    workstation-host:
      rule: Host(`ds.example.com`)
      entryPoints:
        - websecure-external
      tls: {}
      service: workstation-host
      middlewares:
        - chain-external

    workstation-host-internal:
      rule: "Host(`ds.example.com`)"
      entryPoints:
        - websecure-internal
      tls: {}
      service: workstation-host
      middlewares:
        - chain-internal

    unifi:
      rule: Host(`unifi.example.com`)
      entryPoints:
        - websecure-external
      tls: {}
      service: unifi
      middlewares:
        - chain-external

    unifi-internal:
      rule: "Host(`unifi.example.com`)"
      entryPoints:
        - websecure-internal
      tls: {}
      service: unifi
      middlewares:
        - chain-internal

  services:
    adguard-secondary:
      loadBalancer:
        servers:
          - url: "http://192.0.2.2"

    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.0.2.10:8123"

    unifi:
      loadBalancer:
        servers:
          - url: "http://192.0.2.1"

    storage-host:
      loadBalancer:
        servers:
          - url: "http://192.0.2.99:8081"

    workstation-host:
      loadBalancer:
        servers:
          - url: "http://192.0.2.5:5000"
