configs:
  # The CrowdSec bouncer middleware, dropped into the file provider's rules directory.
  # Settings are the ones the labels on the traefik service used to carry.
  #
  # The LAPI key is not inlined here: this file is world-readable inside the container and
  # its content is tracked in git, so the plugin reads it from crowdsec_lapi_key below,
  # which is the same `${...}` value but never lands in the rules directory.
  #
  # forwardedHeadersTrustedIPs takes a list, and the env var is the comma-separated
  # Cloudflare range set that cloudflare_trusted_ips.py maintains. Wrapping it in a flow
  # sequence keeps that one source of truth: compose substitutes the string, YAML splits
  # it on the commas. The IPv6 ranges stay unquoted plain scalars, which is legal because
  # none of their colons is followed by a space.
  crowdsec_bouncer:
    content: |
      http:
        middlewares:
          crowdsec-bouncer:
            plugin:
              bouncer:
                enabled: "true"
                crowdsecMode: stream
                crowdsecLapiScheme: http
                crowdsecLapiHost: crowdsec:8080
                crowdsecLapiPath: /
                crowdsecLapiKeyFile: /run/secrets/crowdsec-lapi-key
                forwardedHeadersTrustedIPs: [${CROWDSEC_FORWARDED_HEADERS_TRUSTED_IPS}]

  crowdsec_lapi_key:
    content: ${CROWDSEC_TRAEFIK_BOUNCER_API_KEY}

networks:
  smoonet:
    external: true
