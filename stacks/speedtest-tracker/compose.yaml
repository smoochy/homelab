services:
  speedtest-tracker:
    container_name: speedtest-tracker
    # The app serves on container port 1000. /api/health is not routed in this build -
    # it answers 404 - so the probe uses the root path, which redirects to the UI once
    # the web server is up.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:1000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: ghcr.io/linuxserver/speedtest-tracker:v1.15.0-ls169@sha256:59518a6f2b49254b310cc2e543320dd3fbaa80381b588cd1f2bf116073698c27
    restart: unless-stopped

    # No `logging:` block. This stack was the pilot for the fleetwide log-driver switch
    # (#978) and carried the syslog configuration alone while it burned in. That same
    # configuration is now the daemon default in /etc/docker/daemon.json, so the block
    # here would only be a second copy that drifts.

    # Network
    networks:
      smoonet:
    # Ports
    ports:
      - "8003:1000/tcp" # Web UI
    # Volumes
    volumes:
      - /mnt/user/appdata/speedtest-tracker:/config:rw # Config & data [web:58]
    # Environment variables
    environment:
      - HOST_CONTAINERNAME=speedtest-tracker
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      - TZ=Europe/Berlin

      # App config
      - APP_KEY=${APP_KEY}
      - APP_URL=${UNRAID_WEBGUI_URL}
      - DB_CONNECTION=sqlite
      - DISPLAY_TIMEZONE=Europe/Berlin
      - PRUNE_RESULTS_OLDER_THAN=365 # Days
      - SPEEDTEST_BLOCKED_SERVERS=31448,30907
      - SPEEDTEST_SCHEDULE="0 */2 * * *" # Every 2h
      # LinuxServer user mapping
      - PGID=100
      - PUID=99
      - UMASK=022

    # Resource limits
    deploy:
      resources:
        limits:
          pids: 2048
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${SERVICE}-internal.middlewares=chain-internal@file
      - traefik.http.routers.${SERVICE}-internal.priority=5000
      - traefik.http.routers.${SERVICE}-internal.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-internal.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${SERVICE}-external.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-external.middlewares=chain-external@file
      - traefik.http.routers.${SERVICE}-external.priority=10
      - traefik.http.routers.${SERVICE}-external.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-external.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-external.tls=true
      # # HTTP-Header
      - traefik.http.routers.${SERVICE}-bypass.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-bypass.middlewares=chain-external-bypass@file
      - traefik.http.routers.${SERVICE}-bypass.priority=2500
      - traefik.http.routers.${SERVICE}-bypass.rule=Host(`${TRAEFIK_EXTERNAL_URL}`) && Header(`${SPECIAL_HEADER_NAME}`, `${SPECIAL_HEADER_SECRET}`)
      - traefik.http.routers.${SERVICE}-bypass.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-bypass.tls=true
      # Service port (app on 80)
      - traefik.docker.network=smoonet
      - traefik.http.services.${SERVICE}.loadbalancer.server.url=${TRAEFIK_INTERNAL_URL}
      ## End Traefik Config
      # Uptime Kuma monitor, owned by AutoKuma. Rebuild of the hand-built http monitor
      # id 7, migration wave 3b. No basic_auth and no headers: #1809 measured the endpoint
      # answering 200 without credentials, and the columns on the old monitor are leftovers
      # of a Traefik middleware that no longer exists.
      - kuma.speedtest-tracker.http.name=speedtest-tracker - speedtest-tracker
      - kuma.speedtest-tracker.http.url=https://speed.example.com
      - kuma.speedtest-tracker.http.method=GET
      - 'kuma.speedtest-tracker.http.accepted_statuscodes=["200-299"]'
      - kuma.speedtest-tracker.http.max_redirects=10
      - kuma.speedtest-tracker.http.http_body_encoding=json
      - kuma.speedtest-tracker.http.timeout=4
      - kuma.speedtest-tracker.http.interval=300
      - kuma.speedtest-tracker.http.max_retries=1
      - kuma.speedtest-tracker.http.retry_interval=300
      - kuma.speedtest-tracker.http.resend_interval=0
      - kuma.speedtest-tracker.http.ignore_tls=false
      - kuma.speedtest-tracker.http.expiry_notification=true
      - kuma.speedtest-tracker.http.upside_down=false
      - 'kuma.speedtest-tracker.http.notification_id_list={"1": true}'
      - com.smoochy.komodo.restore_stack=speedtest-tracker
      - net.unraid.docker.icon=https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/speedtest-tracker-logo.png
      - net.unraid.docker.webui=${UNRAID_WEBGUI_URL}
networks:
  smoonet:
    external: true
