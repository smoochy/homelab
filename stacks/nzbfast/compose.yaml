services:
  nzbfast:
    container_name: nzbfast
    # No `depends_on`: gluetun is a service of the sabnzbd stack and compose can
    # only order services inside one project, so `depends_on: gluetun` fails
    # config validation with "depends on undefined service". Starting before
    # gluetun is up fails with "cannot join network of a non running container",
    # and a later gluetun restart swaps the namespace out from under this
    # container: both cases are covered by the Komodo restore label
    # (com.smoochy.komodo.restore_stack=gluetun below), so redeploy order is
    # gluetun first, then this stack.
    # Derived image (#5158): the pinned nzbfast plus jq, python3, PyYAML and wget,
    # which the post-processing script needs. The pin lives in image/Dockerfile.
    build:
      context: ./image
      args:
        # Bump with scripts/src-rev.sh - see issue #935.
        SRC_REV: 11dce5472e6a
    image: nzbfast:local
    # Built locally and never published, so a registry pull must not be attempted.
    pull_policy: build
    # healthcheck: the image ships curl and no wget, so this is the curl fallback
    # form against the same /api?mode=version endpoint the image's own HEALTHCHECK
    # uses.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:6789/api?mode=version&output=json' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

    # Network: shares gluetun's namespace (VPN routing), same posture as sabnzbd.
    # No ports are published; Traefik reaches the UI through gluetun on smoonet.
    # NZBFAST_PORT_LOCKED stays at the image default (1) and the dashboard port 6789
    # does not collide with anything gluetun publishes (8000, 8001, 8082, 8888).
    network_mode: "container:gluetun"

    # Volumes: absolute host paths only, a relative path silently resolves to a
    # fresh empty folder depending on the working directory.
    volumes:
      # The mirrored script tree sabnzbd also uses; the `script` setting in
      # /config/settings.json points at /scripts/current/sabnzbd/*.sh (README).
      - /mnt/user/appdata/qbittorrent/scripts:/scripts:ro
      - /mnt/user/appdata/nzbfast:/config # settings.json, apikey file, index database
      - /mnt/user/appdata/nzbfast/watch:/watch
      - /mnt/user/data/:/data/
      # nzbfast writes finished jobs straight to their final path under
      # NZBFAST_OUT and has no incomplete directory. The usenet tree comes from
      # disk1 in one bind for the same reason as in the sabnzbd stack:
      # the post-processing staging step hard-links completed files into the
      # staging tree, and linkat(2) returns EXDEV across two bind mounts.
      - /mnt/disk1/data/usenet:/data/usenet

    environment:
      - HOST_CONTAINERNAME=nzbfast
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      - PGID=100
      - PUID=99
      - TZ=Europe/Berlin
      - NZBFAST_OUT=/data/usenet
      # No UMASK: the image entrypoint does not read it.
      # The API key is minted on first start into /config/apikey; the sabnzbd
      # helper scripts read it from there (or from NZBFAST_APIKEY if ever pinned).

    deploy:
      resources:
        limits:
          pids: 2048
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${SERVICE}-internal.middlewares=chain-internal@file
      - traefik.http.routers.${SERVICE}-internal.priority=5000
      - traefik.http.routers.${SERVICE}-internal.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-internal.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${SERVICE}-external.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-external.middlewares=chain-external@file
      - traefik.http.routers.${SERVICE}-external.priority=10
      - traefik.http.routers.${SERVICE}-external.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-external.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-external.tls=true
      # # HTTP-Header
      - traefik.http.routers.${SERVICE}-bypass.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-bypass.middlewares=chain-external-bypass@file
      - traefik.http.routers.${SERVICE}-bypass.priority=2500
      - traefik.http.routers.${SERVICE}-bypass.rule=Host(`${TRAEFIK_EXTERNAL_URL}`) && Header(`${SPECIAL_HEADER_NAME}`, `${SPECIAL_HEADER_SECRET}`)
      - traefik.http.routers.${SERVICE}-bypass.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-bypass.tls=true
      # Service port (nzbfast: 6789 inside gluetun's namespace)
      - traefik.docker.network=smoonet
      - traefik.http.services.${SERVICE}.loadbalancer.server.url=${TRAEFIK_INTERNAL_URL}
      ## End Traefik Config
      # Uptime Kuma monitor, owned by AutoKuma.
      - kuma.nzbfast.http.name=nzbfast - nzbfast
      - kuma.nzbfast.http.url=https://${TRAEFIK_EXTERNAL_URL}
      - kuma.nzbfast.http.method=GET
      - 'kuma.nzbfast.http.accepted_statuscodes=["200-299"]'
      - kuma.nzbfast.http.max_redirects=10
      - kuma.nzbfast.http.http_body_encoding=json
      - kuma.nzbfast.http.timeout=4
      - kuma.nzbfast.http.interval=300
      - kuma.nzbfast.http.max_retries=1
      - kuma.nzbfast.http.retry_interval=300
      - kuma.nzbfast.http.resend_interval=0
      - kuma.nzbfast.http.ignore_tls=false
      - kuma.nzbfast.http.expiry_notification=true
      - kuma.nzbfast.http.upside_down=false
      - 'kuma.nzbfast.http.notification_id_list={"1": true}'
      - com.smoochy.komodo.restore_stack=gluetun
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nzbfast.png
      - net.unraid.docker.webui=${UNRAID_WEBGUI_URL}
