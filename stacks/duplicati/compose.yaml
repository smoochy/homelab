services:
  duplicati:
    container_name: duplicati
    # Duplicati serves its UI on 8200 and exposes no dedicated health endpoint, so the
    # probe falls back to the root path.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8200/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: ghcr.io/linuxserver/duplicati:v2.4.0.0_stable_2026-09-03-ls308@sha256:5c65d960f4885579096979cb791cb379835872b1b125768deaf342ea1ff2f247
    restart: unless-stopped
    deploy:
      resources:
        limits:
          pids: 2048
    networks:
      smoonet:
    ports:
      - "8200:8200/tcp"
    volumes:
      - /mnt/user/appdata/duplicati/config:/config:rw
      # Local backup target lives on the dedicated 500GB SSD (/dev/sda1), not on the cache pool.
      - /mnt/backup/duplicati:/backups:rw
      # Expose the Unraid mount tree directly so Duplicati can browse shares and disks under /source.
      - /:/source:ro
    environment:
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI__WEBSERVICE_PASSWORD}
      - HOST_CONTAINERNAME=${SERVICE}
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      # Runs as root so the backup can read root-owned appdata files. As UID 99 the first
      # run skipped 9003 files with PermissionDenied, among them crowdsec, komodo, traefik
      # and adguard configuration. /source is mounted read-only, so root gains read access
      # only, and the only writable paths stay /config and the SSD target.
      - PGID=0
      - PUID=0
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - TZ=Europe/Berlin
      - UMASK=022
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${SERVICE}-internal.middlewares=chain-internal@file
      - traefik.http.routers.${SERVICE}-internal.priority=5000
      - traefik.http.routers.${SERVICE}-internal.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-internal.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${SERVICE}-external.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-external.middlewares=chain-external@file
      - traefik.http.routers.${SERVICE}-external.priority=10
      - traefik.http.routers.${SERVICE}-external.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-external.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-external.tls=true
      # # HTTP-Header
      - traefik.http.routers.${SERVICE}-bypass.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-bypass.middlewares=chain-external-bypass@file
      - traefik.http.routers.${SERVICE}-bypass.priority=2500
      - traefik.http.routers.${SERVICE}-bypass.rule=Host(`${TRAEFIK_EXTERNAL_URL}`) && Header(`${SPECIAL_HEADER_NAME}`, `${SPECIAL_HEADER_SECRET}`)
      - traefik.http.routers.${SERVICE}-bypass.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-bypass.tls=true
      # Service port (Duplicati UI on 8200)
      - traefik.docker.network=smoonet
      - traefik.http.services.${SERVICE}.loadbalancer.server.url=${TRAEFIK_INTERNAL_URL}
      ## End Traefik Config
      - com.smoochy.komodo.restore_stack={SERVICE}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/duplicati.png
      - net.unraid.docker.webui=${UNRAID_WEBGUI_URL}

networks:
  smoonet:
    external: true
