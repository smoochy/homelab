services:
  sonarr:
    container_name: sonarr
    deploy:
      resources:
        limits:
          pids: 2048
    environment:
      - HOST_CONTAINERNAME=${SERVICE}
      - HOST_HOSTNAME=homelab-host
      - HOST_OS=Unraid
      - PGID=100
      - PUID=99
      - SONARR_BRANCH=main
      - SONARR_CHANNEL=v4-stable
      - TZ=Europe/Berlin
      - UMASK=022
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8989/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls325@sha256:b19949ea2977d2f11ec955b3ce4dbba36cb5318c4a666caa6adfeca58f8a993f
    # Network configuration. The address is pinned because the upload lane runs inside the
    # qBittorrent stack's VPN namespace, whose resolver is the tunnel's, so Docker DNS
    # never resolves "sonarr" there and the media server URL has to be a literal IP.
    networks:
      smoonet:
        ipv4_address: 172.18.0.15
    ports:
      - "8989:8989/tcp"
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/sonarr:/config:rw
      - /mnt/user/data:/data:rw
    ## Start Traefik Config
    labels:
      - traefik.enable=true
      # # Internal
      - traefik.http.routers.${SERVICE}-internal.entrypoints=websecure-internal
      - traefik.http.routers.${SERVICE}-internal.middlewares=chain-internal@file
      - traefik.http.routers.${SERVICE}-internal.priority=5000
      - traefik.http.routers.${SERVICE}-internal.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-internal.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-internal.tls=true
      # # External
      - traefik.http.routers.${SERVICE}-external.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-external.middlewares=chain-external@file
      - traefik.http.routers.${SERVICE}-external.priority=10
      - traefik.http.routers.${SERVICE}-external.rule=Host(`${TRAEFIK_EXTERNAL_URL}`)
      - traefik.http.routers.${SERVICE}-external.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-external.tls=true
      # # HTTP-Header
      - traefik.http.routers.${SERVICE}-bypass.entrypoints=websecure-external
      - traefik.http.routers.${SERVICE}-bypass.middlewares=chain-external-bypass@file
      - traefik.http.routers.${SERVICE}-bypass.priority=2500
      - traefik.http.routers.${SERVICE}-bypass.rule=Host(`${TRAEFIK_EXTERNAL_URL}`) && Header(`${SPECIAL_HEADER_NAME}`, `${SPECIAL_HEADER_SECRET}`)
      - traefik.http.routers.${SERVICE}-bypass.service=${SERVICE}
      - traefik.http.routers.${SERVICE}-bypass.tls=true
      # Service port (must match the port Komodo listens on INSIDE the container)
      - traefik.docker.network=smoonet
      - traefik.http.services.${SERVICE}.loadbalancer.server.url=${TRAEFIK_INTERNAL_URL}
      ## End Traefik Config
      # Uptime Kuma monitor, owned by AutoKuma. Rebuild of the hand-built http monitor
      # id 5, migration wave 3b. No basic_auth and no headers: #1809 measured the endpoint
      # answering 200 without credentials, and the columns on the old monitor are leftovers
      # of a Traefik middleware that no longer exists.
      - kuma.sonarr.http.name=sonarr - sonarr
      - kuma.sonarr.http.url=https://sonarr.example.com
      - kuma.sonarr.http.method=GET
      - 'kuma.sonarr.http.accepted_statuscodes=["200-299"]'
      - kuma.sonarr.http.max_redirects=10
      - kuma.sonarr.http.http_body_encoding=json
      - kuma.sonarr.http.timeout=4
      - kuma.sonarr.http.interval=300
      - kuma.sonarr.http.max_retries=1
      - kuma.sonarr.http.retry_interval=300
      - kuma.sonarr.http.resend_interval=0
      - kuma.sonarr.http.ignore_tls=false
      - kuma.sonarr.http.expiry_notification=true
      - kuma.sonarr.http.upside_down=false
      - 'kuma.sonarr.http.notification_id_list={"1": true}'
      # Komodo restore
      - com.smoochy.komodo.restore_stack=${SERVICE}
      # Unraid metadata
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sonarr.png
      - net.unraid.docker.webui=${UNRAID_WEBGUI_URL}
networks:
  smoonet:
    external: true
